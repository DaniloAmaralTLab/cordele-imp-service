packages:
  - "services/imp-service"

# pnpm >=10 blocks dependency build scripts by default (ERR_PNPM_IGNORED_BUILDS).
# Prisma needs its postinstall to generate the client and fetch the engines.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@scarf/scarf': false
  protobufjs: false
  cpu-features: false
  ssh2: false

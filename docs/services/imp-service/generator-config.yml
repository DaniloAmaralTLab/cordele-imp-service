service: imp-service
type: standard
port: 3000

domain:
  aggregates:
    - Manuscrito
  entities:
    - SegmentoCuradoria

enums:
  Formato:
    - docx
    - markdown
  ManuscritoStatus:
    - imported
    - parsing
    - import_failed

application_services:
  - name: ManuscritoService
    operations:
      - upload
      - findById
      - findEstrutura
      - listByProjeto
  - name: SegmentoCuradoriaService
    operations:
      - ignore
      - restore
      - listIgnored
  - name: ConfirmEstruturaService
    operations:
      - confirm

outbound_ports:
  - FileStoragePort
  - ManuscriptParserPort

consumed_events: []

events:
  published:
    - ManuscriptImported
    - ManuscriptImportRejected
